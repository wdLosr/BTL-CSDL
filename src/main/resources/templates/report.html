<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${page.title}"></title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><main class="wrap"><a class="back" th:href="@{/}">Về trang chủ</a><h1 th:text="${page.title}"></h1><form class="filters" data-live-validation method="post" th:action="@{/m/{slug}(slug=${page.slug})}" novalidate><div class="field" th:each="field : ${page.fields}"><label th:for="${field.key}" th:text="${field.label} + (${field.required} ? ' *' : '')"></label><input th:id="${field.key}" th:name="${field.key}" th:attr="data-kind=${field.type},data-label=${field.label}" th:type="${field.type == 'date' ? 'date' : 'text'}" th:value="${values[field.key]}" th:required="${field.required}"><small class="error" aria-live="polite" th:text="${errors[field.key]}"></small></div><button type="submit">Xem báo cáo</button></form><p class="notice" th:if="${success}">Chưa có dữ liệu</p><div class="table-scroll"><table th:if="${page.slug == 'thu-hoc-phi'}"><thead><tr><th>Mã phiếu</th><th>Ngày thu</th><th>Học viên</th><th>Lớp</th><th>Phương thức</th><th>Số tiền</th></tr></thead><tbody><tr><td colspan="6" class="empty">Chưa có dữ liệu</td></tr></tbody><tfoot><tr><th colspan="5">Tổng thực thu</th><td>—</td></tr></tfoot></table><table th:if="${page.slug == 'danh-gia'}"><thead><tr><th>Mã học viên</th><th>Họ tên</th><th>Điểm</th><th>Trạng thái</th></tr></thead><tbody><tr><td colspan="4" class="empty">Chưa có dữ liệu</td></tr></tbody></table></div><div class="summary" th:if="${page.slug == 'danh-gia'}"><span>Số đủ điều kiện: —</span><span>Đã nhập: —</span><span>Chưa nhập: —</span><span>Điểm trung bình: —</span></div><div class="signatures"><span>Người lập: __________________</span><span>Người nhận: __________________</span></div><div class="export"><button type="button" disabled>Xuất Excel</button><small>Có dữ liệu mới xuất được</small></div></main><script defer th:src="@{/js/live-validation.js}"></script></body></html>
