<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản lý trung tâm tiếng Anh</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><main class="wrap"><h1>Quản lý trung tâm tiếng Anh</h1><section th:each="group : ${ {'Danh mục','Nghiệp vụ','Báo cáo'} }"><h2 th:text="${group}"></h2><div class="nav"><a th:each="page : ${pages}" th:if="${page.group == group}" th:href="@{/m/{slug}(slug=${page.slug})}" th:text="${page.title}"></a></div></section></main></body></html>
