<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${page.title}"></title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><main class="wrap narrow"><a class="back" th:href="@{/}">Về trang chủ</a><h1 th:text="${page.title}"></h1><p class="notice success" th:if="${success}">Dữ liệu hợp lệ. Bản demo chưa lưu dữ liệu.</p><form data-live-validation method="post" th:action="@{/m/{slug}(slug=${page.slug})}" novalidate><div class="field" th:each="field : ${page.fields}"><label th:for="${field.key}" th:text="${field.label} + (${field.required} ? ' *' : '')"></label><select th:if="${field.type == 'select'}" th:id="${field.key}" th:name="${field.key}" th:attr="data-kind=${field.type},data-label=${field.label}"><option value="">-- Chọn --</option><option th:each="option : ${field.options}" th:value="${option}" th:text="${option}" th:selected="${values[field.key] == option}"></option></select><input th:unless="${field.type == 'select'}" th:id="${field.key}" th:name="${field.key}" th:attr="data-kind=${field.type},data-label=${field.label}" th:type="${field.type == 'date' ? 'date' : field.type == 'datetime-local' ? 'datetime-local' : field.type == 'email' ? 'email' : field.type == 'tel' ? 'tel' : (field.type == 'positiveInt' or field.type == 'positiveDecimal' or field.type == 'nonnegativeDecimal' or field.type == 'moneyNonnegative') ? 'number' : 'text'}" th:step="${field.type == 'positiveInt' ? '1' : (field.type == 'positiveDecimal' or field.type == 'nonnegativeDecimal' or field.type == 'moneyNonnegative') ? 'any' : null}" th:min="${field.type == 'positiveInt' ? '1' : (field.type == 'positiveDecimal' or field.type == 'nonnegativeDecimal' or field.type == 'moneyNonnegative') ? '0' : null}" th:value="${values[field.key]}" th:required="${field.required}"><small class="error" aria-live="polite" th:text="${errors[field.key]}"></small></div><button type="submit">Lưu</button></form></main><script defer th:src="@{/js/live-validation.js}"></script></body></html>
